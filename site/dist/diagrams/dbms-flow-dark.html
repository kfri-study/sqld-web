        </style></head><body><main><p class="eyebrow">SQLD · DIAGRAM DESIGN</p><h1>DB·DBMS·SQL의 역할</h1><div class="diagram-container"><svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dbms-flow-dark-title dbms-flow-dark-desc"><title id="dbms-flow-dark-title">DB·DBMS·SQL의 역할</title><desc id="dbms-flow-dark-desc">앱이나 접속 도구가 SQL 요청을 보내면 DBMS가 권한과 제약을 확인하며 데이터베이스의 데이터를 처리한다.</desc><defs><marker id="dbms-flow-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bfd0e7"/></marker></defs><rect width="960" height="600" fill="#172b4a"/><style>

</style><text x="48" y="48" class="d-title" >SQL은 요청 언어, DBMS는 요청을 처리하는 프로그램</text><path d="M292 220 H356 M604 220 H668" class="edge arrow" marker-end="url(#dbms-flow-dark-arrow)"/><rect x="48" y="112" width="244" height="224" rx="6" fill="#203b60" stroke="#bfd0e7"/><text x="64" y="136" class="d-code" >CLIENT</text><text x="64" y="164" class="d-head" >앱 또는 접속 도구</text><line x1="48" y1="180" x2="292" y2="180" class="d-rule"/><text x="64" y="208" class="d-text" >사람의 요청을 SQL로 작성</text><text x="64" y="236" class="d-text" >SELECT ... FROM loan</text><text x="64" y="264" class="d-text" >결과 표를 화면에 표시</text><rect x="356" y="112" width="248" height="224" rx="6" fill="#294b77" stroke="#bfd0e7"/><text x="372" y="136" class="d-code" >SOFTWARE</text><text x="372" y="164" class="d-head" >DBMS</text><line x1="356" y1="180" x2="604" y2="180" class="d-rule"/><text x="372" y="208" class="d-text" >문장 해석·실행</text><text x="372" y="236" class="d-text" >권한·제약조건 검사</text><text x="372" y="264" class="d-text" >동시 작업·복구 관리</text><rect x="668" y="112" width="244" height="224" rx="6" fill="#203b60" stroke="#bfd0e7"/><text x="684" y="136" class="d-code" >DATA</text><text x="684" y="164" class="d-head" >DB</text><line x1="668" y1="180" x2="912" y2="180" class="d-rule"/><text x="684" y="208" class="d-text" >대여 기록과 지점 정보</text><text x="684" y="236" class="d-text" >테이블 · 행 · 열</text><text x="684" y="264" class="d-text" >키와 관계로 구조화</text><text x="48" y="400" class="d-text" >실제 예: pgAdmin(도구) → SQL(언어) → PostgreSQL(DBMS) → 대여 데이터(DB)</text><text x="48" y="440" class="d-small" >관리형 서비스는 DBMS 운영의 일부를 제공자가 맡는 방식입니다.</text><text x="48" y="472" class="d-small" >SQLite는 별도 서버 없이 앱 안에서 엔진이 동작할 수 있어 모든 DBMS가 서버형인 것은 아닙니다.</text><line x1="56" y1="536" x2="904" y2="536" stroke="#bfd0e7" stroke-opacity=".3"/><text x="56" y="568" class="label">CLIENT = 요청하는 쪽 · SQL = 언어 · DBMS = 관리 프로그램 · DB = 데이터 집합 · 전형적 서버형 예시</text></svg></div></main></body></html>
