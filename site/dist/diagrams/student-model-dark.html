        </style></head><body><main><p class="eyebrow">SQLD · DIAGRAM DESIGN</p><h1>학생과 과목을 연결하는 수강</h1><div class="diagram-container"><svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="student-model-dark-title student-model-dark-desc"><title id="student-model-dark-title">학생과 과목을 연결하는 수강</title><desc id="student-model-dark-desc">학생과 과목의 다대다 관계를 수강 엔터티로 풀며 각 수강은 학생 한 명과 과목 하나에 연결된다.</desc><defs><marker id="student-model-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bfd0e7"/></marker></defs><rect width="960" height="600" fill="#172b4a"/><path d="M280 280 H368 M592 280 H680" class="edge"/><text x="296" y="264" class="label">1</text><text x="336" y="264" class="label">0..N</text><text x="608" y="264" class="label">0..N</text><text x="652" y="264" class="label">1</text><g><rect x="56" y="184" width="224" height="208" rx="6" fill="#203b60" stroke="#bfd0e7"/>
