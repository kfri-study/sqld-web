        </style></head><body><main><p class="eyebrow">SQLD · DIAGRAM DESIGN</p><h1>정규화로 정보를 나누기</h1><p class="editorial">과목코드가 교수를 결정하고 점수가 학점을 결정한다는 가정에서 수강을 세 관계로 분해한다.</p><div class="diagram-container"><svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="normalization-full-title normalization-full-desc"><title id="normalization-full-title">정규화로 정보를 나누기</title><desc id="normalization-full-desc">과목코드가 교수를 결정하고 점수가 학점을 결정한다는 가정에서 수강을 세 관계로 분해한다.</desc><defs><marker id="normalization-full-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#536580"/></marker></defs><rect width="960" height="600" fill="#f4f7fc"/><path d="M424 240 V288 H168 V344 M480 240 V344 M536 240 V288 H792 V344" class="edge"/><g><rect x="360" y="56" width="240" height="184" rx="6" fill="#e5eefc" stroke="#315f9e"/>
    <text x="380" y="80" class="tag">BEFORE</text>
    <text x="380" y="108" class="name">분해 전 수강</text><text x="380" y="136" class="field">학번 · 과목코드 · 교수</text><text x="380" y="160" class="field">점수 · 학점</text></g><g><rect x="56" y="344" width="224" height="152" rx="6" fill="#ffffff" stroke="#536580"/>
    <text x="76" y="368" class="tag">2NF</text>
    <text x="76" y="396" class="name">과목</text><text x="76" y="424" class="field"># 과목코드</text><text x="76" y="448" class="field">교수</text></g><g><rect x="368" y="344" width="224" height="152" rx="6" fill="#ffffff" stroke="#536580"/>
    <text x="388" y="368" class="tag">RESULT</text>
    <text x="388" y="396" class="name">수강</text><text x="388" y="424" class="field"># 학번 + 과목코드</text><text x="388" y="448" class="field">점수</text></g><g><rect x="680" y="344" width="224" height="152" rx="6" fill="#ffffff" stroke="#536580"/>
    <text x="700" y="368" class="tag">3NF</text>
