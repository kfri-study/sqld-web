        </style></head><body><main><p class="eyebrow">SQLD · DIAGRAM DESIGN</p><h1>반복되는 사실을 분리하는 정규화</h1><div class="diagram-container"><svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="normalization-dark-title normalization-dark-desc"><title id="normalization-dark-title">반복되는 사실을 분리하는 정규화</title><desc id="normalization-dark-desc">과목이 교수를 결정하고 점수가 학점을 결정한다는 가정 아래 중복 사실을 과목과 학점기준으로 분리한다.</desc><defs><marker id="normalization-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bfd0e7"/></marker></defs><rect width="960" height="600" fill="#172b4a"/><style>

</style><text x="48" y="48" class="d-title" >같은 교수 정보를 여러 수강 행에 반복 저장하면?</text><rect x="48" y="88" width="864" height="176" rx="6" fill="#294b77" stroke="#bfd0e7"/><text x="64" y="112" class="d-code" >BEFORE</text><text x="64" y="140" class="d-head" >분해 전: 수강마다 담당 교수 이름이 반복됨</text><line x1="48" y1="156" x2="912" y2="156" class="d-rule"/><text x="64" y="184" class="d-text" >학번 101 · SQL01 · 한교수 · 점수 80 · 학점 B</text><text x="64" y="212" class="d-text" >학번 102 · SQL01 · 한교수 · 점수 90 · 학점 A</text><text x="64" y="240" class="d-text" >교수 변경 시 두 행을 모두 수정해야 함 → 일부만 수정하면 서로 달라짐</text><path d="M192 264 V320 M480 264 V320 M768 264 V320" class="edge"/><rect x="48" y="320" width="256" height="160" rx="6" fill="#203b60" stroke="#bfd0e7"/><text x="64" y="344" class="d-code" >PARTIAL DEPENDENCY</text><text x="64" y="372" class="d-head" >과목</text><line x1="48" y1="388" x2="304" y2="388" class="d-rule"/><text x="64" y="416" class="d-text" >PK 과목코드 → 교수</text><text x="64" y="444" class="d-text" >SQL01 → 한교수</text><rect x="352" y="320" width="256" height="160" rx="6" fill="#203b60" stroke="#bfd0e7"/><text x="368" y="344" class="d-code" >RESULT</text><text x="368" y="372" class="d-head" >수강</text><line x1="352" y1="388" x2="608" y2="388" class="d-rule"/><text x="368" y="416" class="d-text" >PK 학번 + 과목코드</text><text x="368" y="444" class="d-text" >101 · SQL01 → 80</text><rect x="656" y="320" width="256" height="160" rx="6" fill="#203b60" stroke="#bfd0e7"/><text x="672" y="344" class="d-code" >TRANSITIVE DEPENDENCY</text><text x="672" y="372" class="d-head" >학점기준</text><line x1="656" y1="388" x2="912" y2="388" class="d-rule"/><text x="672" y="416" class="d-text" >PK 점수 → 학점</text><text x="672" y="444" class="d-text" >80 → B, 90 → A</text><text x="48" y="516" class="d-small" >과목 정보와 학점 기준은 각 한 곳에서 관리하고, 수강에는 연결할 값과 점수를 남깁니다.</text><line x1="56" y1="536" x2="904" y2="536" stroke="#bfd0e7" stroke-opacity=".3"/><text x="56" y="568" class="label">가정: 과목코드 → 교수, 점수 → 학점 · 2NF: 부분 종속 제거 · 3NF: 비키
