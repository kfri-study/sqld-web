</style><text x="48" y="40" class="d-title" >WHERE와 HAVING을 지나며 결과가 줄어듭니다</text><path d="M312 172 H348 M612 172 H648 M780 264 V316 M648 404 H612 M348 404 H312" class="edge arrow" marker-end="url(#sql-order-full-arrow)"/><rect x="48" y="80" width="264" height="184" rx="6" fill="#ffffff" stroke="#536580"/><text x="64" y="104" class="d-code" >대여 기록 5행</text><text x="64" y="132" class="d-head" >01  FROM</text><line x1="48" y1="148" x2="312" y2="148" class="d-rule"/><text x="64" y="176" class="d-text" >지점10: 120, 180</text><text x="64" y="204" class="d-text" >지점20: 180, 300</text><text x="64" y="232" class="d-text" >지점NULL: 금액NULL</text><rect x="348" y="80" width="264" height="184" rx="6" fill="#ffffff" stroke="#536580"/><text x="364" y="104" class="d-code" >fee IS NOT NULL</text><text x="364" y="132" class="d-head" >02  WHERE</text><line x1="348" y1="148" x2="612" y2="148" class="d-rule"/><text x="364" y="176" class="d-text" >미확정 금액 행 제외</text><text x="364" y="204" class="d-text" >지점10: 120, 180</text><text x="364" y="232" class="d-text" >지점20: 180, 300</text><rect x="648" y="80" width="264" height="184" rx="6" fill="#ffffff" stroke="#536580"/><text x="664" y="104" class="d-code" >branch_id별 집계</text><text x="664" y="132" class="d-head" >03  GROUP BY</text><line x1="648" y1="148" x2="912" y2="148" class="d-rule"/><text x="664" y="176" class="d-text" >지점10 → 합계 300</text><text x="664" y="204" class="d-text" >지점20 → 합계 480</text><text x="664" y="232" class="d-text" >두 그룹 생성</text><rect x="648" y="316" width="264" height="184" rx="6" fill="#e5eefc" stroke="#536580"/><text x="664" y="340" class="d-code" >SUM(fee) &gt;= 400</text><text x="664" y="368" class="d-head" >04  HAVING</text><line x1="648" y1="384" x2="912" y2="384" class="d-rule"/><text x="664" y="412" class="d-text" >지점10 합계 300 제외</text><text x="664" y="440" class="d-text" >지점20 합계 480 유지</text><rect x="348" y="316" width="264" height="184" rx="6" fill="#ffffff" stroke="#536580"/><text x="364" y="340" class="d-code" >출력할 열 선택</text><text x="364" y="368" class="d-head" >05  SELECT</text><line x1="348" y1="384" x2="612" y2="384" class="d-rule"/><text x="364" y="412" class="d-text" >branch_id | fee_sum</text><text x="364" y="440" class="d-text" >20        | 480</text><rect x="48" y="316" width="264" height="184" rx="6" fill="#ffffff" stroke="#536580"/><text x="64" y="340" class="d-code" >branch_id 오름차순</text><text x="64" y="368" class="d-head" >06  ORDER BY</text><line x1="48" y1="384" x2="312" y2="384" class="d-rule"/><text x="64" y="412" class="d-text" >최종 결과 한 행</text><text x="64" y="440" class="d-text" >20        | 480</text><line x1="56" y1="536" x2="904" y2="536" stroke="#536580" stroke-opacity=".3"/><text x="56" y="568" class="label">논리적 해석 예시 · 5행 → 4행 → 2그룹 → 1그룹 → 결과 1행 · 실제 물리 실행 계획과 구분</text></svg></div></main></body></html>
