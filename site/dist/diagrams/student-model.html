        </style></head><body><main><p class="eyebrow">SQLD · DIAGRAM DESIGN</p><h1>학생·수강·과목의 관계 읽기</h1><div class="diagram-container"><svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="student-model-title student-model-desc"><title id="student-model-title">학생·수강·과목의 관계 읽기</title><desc id="student-model-desc">학생과 과목의 다대다 관계를 수강으로 연결하고 각 방향의 최소·최대 건수를 읽는다.</desc><defs><marker id="student-model-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#536580"/></marker></defs><rect width="960" height="600" fill="#f4f7fc"/><style>

</style><text x="48" y="48" class="d-title" >한 학생의 수강이 여러 행으로 늘어나는 이유</text><path d="M304 248 H352 M608 248 H656" class="edge"/><text x="312" y="224" class="d-code" >1</text><text x="324" y="272" class="d-code" >0..N</text><text x="612" y="272" class="d-code" >0..N</text><text x="636" y="224" class="d-code" >1</text><rect x="48" y="116" width="256" height="268" rx="6" fill="#ffffff" stroke="#536580"/><text x="64" y="140" class="d-code" >STUDENT</text><text x="64" y="168" class="d-head" >학생</text><line x1="48" y1="184" x2="304" y2="184" class="d-rule"/><text x="64" y="212" class="d-text" >PK  student_id</text><text x="64" y="240" class="d-text" >학생 한 명 = 한 행</text><text x="64" y="268" class="d-text" >101  다온</text><text x="64" y="296" class="d-text" >102  라온</text><rect x="352" y="116" width="256" height="268" rx="6" fill="#e5eefc" stroke="#536580"/><text x="368" y="140" class="d-code" >ENROLLMENT</text><text x="368" y="168" class="d-head" >수강</text><line x1="352" y1="184" x2="608" y2="184" class="d-rule"/><text x="368" y="212" class="d-text" >PK  enrollment_id</text><text x="368" y="240" class="d-text" >FK  student_id</text><text x="368" y="268" class="d-text" >FK  course_id</text><text x="368" y="296" class="d-text" >등록일 · 점수</text><rect x="656" y="116" width="256" height="268" rx="6" fill="#ffffff" stroke="#536580"/><text x="672" y="140" class="d-code" >COURSE</text><text x="672" y="168" class="d-head" >과목</text><line x1="656" y1="184" x2="912" y2="184" class="d-rule"/><text x="672" y="212" class="d-text" >PK  course_id</text><text x="672" y="240" class="d-text" >과목 하나 = 한 행</text><text x="672" y="268" class="d-text" >SQL01  SQL 입문</text><text x="672" y="296" class="d-text" >DB01   DB 기초</text><text x="48" y="432" class="d-text" >학생 101은 수강 501·502에 참여 → 학생 1명 : 수강 2건</text><text x="48" y="464" class="d-text" >수강 501은 학생 101과 과목 SQL01을 연결 → 양쪽 부모를 정확히 한 건씩 참조</text><text x="48" y="496" class="d-small" >수강번호를 PK로 쓴 예시입니다. 중복 수강 금지는 학생번호+과목코드의 UNIQUE로 별도 정의합니다.</text><line x1="56" y1="536" x2="904" y2="536" stroke="#536580" stroke-opacity=".3"/><text x="56" y="568" class="label">PK = 행 식별 · FK = 부모 참조 · 0..N = 0건부터 여러 건 · 이 예시는 수강번호를 PK로 사용</text></svg></div></main></body></html>
